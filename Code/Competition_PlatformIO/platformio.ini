[platformio]
default_envs = upload_ota

[env:upload_ota]
platform = espressif32@6.12.0
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
board_build.partitions = min_spiffs.csv
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=admin
    --host_port=3233
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

